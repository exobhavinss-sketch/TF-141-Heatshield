# ============================================================================
# Render Blueprint Configuration — TF-141 HeatShield Platform
# Academic Research Initiative • MIT Vishwaprayag University, Solapur
# ============================================================================
services:
  - type: web
    name: heatshield-tf141
    env: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    autoDeploy: true

    # Single-Page Application (SPA) client-side routing
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    # Granular HTTP response headers: immutable caching for hashed bundles + security
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

    # Supabase public environment variables (configured via Render Dashboard)
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: NODE_VERSION
        value: 20.18.0
