<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TF-141 HeatShield — Urban Heat Exposure Analysis & Cooling Intelligence Platform</title>
    <meta name="description" content="HeatShield is Team TF-141's academic urban heat analysis and cooling-intelligence project for Solapur, Maharashtra. Research summaries use synthetic simulation data." />
    <meta name="theme-color" content="#fafafc" />
    <meta property="og:title" content="TF-141 HeatShield — Urban Heat Analysis" />
    <meta property="og:description" content="Academic urban heat analysis for Solapur, Maharashtra. Research summaries use synthetic simulation data." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/branding/heatshield-icon.svg" />

    <!-- Google Fonts: Inter, Manrope & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Material Symbols Outlined -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <!-- Flash-free Theme Initializer -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('heatshield-theme');
          var isDark = stored === 'dark' || ((!stored || stored === 'system') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#101114');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background dark:bg-[#101114] text-on-surface dark:text-[#f5f5f7] font-body-md antialiased min-h-screen selection:bg-primary-container selection:text-on-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
